<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HomePage">
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop stop-color="#7AB8FF"/>
      <stop offset="0.5" stop-color="#3D7DF0"/>
      <stop offset="1" stop-color="#1D4EC6"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="0.55" x2="0" y2="1">
      <stop stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E8FF"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#08245C" flood-opacity="0.5"/>
    </filter>
    <filter id="wg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="url(#topLight)"/>
  <rect width="64" height="64" rx="14" fill="url(#bottomShade)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="12.75" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
  <path d="M32 11.5 L52 29 V46 C52 48.2 50.2 50 48 50 H16 C13.8 50 12 48.2 12 46 V29 Z"
        fill="url(#house)" stroke="url(#house)" stroke-width="2.5" stroke-linejoin="round" filter="url(#ds)"/>
  <rect x="24.5" y="30.5" width="15" height="11.5" rx="3" fill="#FFC961" filter="url(#wg)"/>
  <rect x="25.9" y="31.9" width="12.2" height="8.7" rx="1.8" fill="#FFE9B8"/>
</svg>

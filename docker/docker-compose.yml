# 单镜像：同一容器内 nginx 托管前端产物，并把 /api /images /icons 反代到本容器 Go 服务（127.0.0.1:8080）；
# 对外仅暴露 3000 → 80。
services:
  homepage:
    image: sereindusk/homepage:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # 与根 package.json 的 version 保持一致，供 /api/version 返回
        VERSION: "0.2"
    ports:
      - "3000:80"
    environment:
      # Go 服务只绑容器内回环，由 nginx 同容器反代，无需对外暴露
      HOST: "127.0.0.1"
      PORT: "8080"
      CONFIG_DIR: /app/config
      # 密钥类变量按需注入（配置 YAML 中用 ${ENV_VAR} 引用）
      # QBIT_PASSWORD: ""
      # EMBY_API_KEY: ""
    volumes:
      # 将本机配置目录挂进容器（五文件 + images/icons）
      # Go 进程以非 root 用户 homepage（uid/gid 由镜像创建）运行，
      # 宿主机 ./config 需可写，否则图标导入/图片上传会失败。示例：
      #   mkdir -p ./config/images && chmod -R a+rwX ./config
      - ./config:/app/config
      # 需要 Docker 容器状态时，只读挂载 socket（可选）
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # 监控宿主机磁盘时，只读挂载根分区，并在 widgets.yaml 中写 disk: /host（可选）
      # - /:/host:ro
    restart: unless-stopped
    healthcheck:
      # 经 nginx 全链路探测：静态托管 + 反代到 Go
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

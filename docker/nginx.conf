# docker/nginx.conf —— web 容器站点配置：托管前端产物并反代 API 与配置资产根。
# 由 nginx:1.30-alpine 挂载为 /etc/nginx/conf.d/default.conf。
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # 对齐原 Go gzip 中间件：小于 512 字节不压缩；
    # 流式类型（NDJSON/SSE）不进压缩列表；js 同时列出新旧 mime 名
    gzip on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json text/plain;

    # 常规响应统一 nosniff；下方单独 add_header 的 location 必须重复本行（nginx 继承规则）
    add_header X-Content-Type-Options nosniff always;

    # 图标导入与图片上传经此反代，放宽 nginx 默认 1m 限制
    client_max_body_size 20m;

    # API 与配置资产根反代到 api 容器。
    # 必须位于所有 regex location 之前，避免静态扩展名规则截走 /images/*.svg；
    # proxy_buffering off 保证 NDJSON/SSE 逐条推送不被缓冲。
    location ~ ^/(api|images|icons)/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML 每次回源校验
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache";
    }

    # SVG 可内嵌脚本：与原 Go 行为一致，按附件下载
    location ~* \.svg$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Disposition attachment;
        try_files $uri =404;
    }

    location ~* \.(ico|png|webmanifest)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余路径回退入口页（SPA fallback，由 nginx 承接）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: build-and-push

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - apps/web/**
      - apps/api/**
      - docker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - tsconfig*.json
      - .dockerignore
      - .github/workflows/build-and-push.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/web/**
      - apps/api/**
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || 'homepage' }}
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  # PR 与推送都先跑静态检查与单测，失败则不产出镜像；Go 与前端互不依赖，拆两个 job 并行
  verify-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Go build
        working-directory: apps/api
        run: go build ./...

      - name: Go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Go test
        working-directory: apps/api
        run: go test -race ./...

  verify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Frontend test
        run: pnpm test

      - name: Frontend lint
        run: pnpm lint

  # 推送到 main 时自动打 tag 并发 Release；版本号未变（tag 已存在）则跳过，只让 merge 更新 latest
  tag-and-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-go, verify-web]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: create_tag
        run: |
          VERSION=$(jq -r .version package.json)
          TAG_NAME="v${VERSION}"
          # 版本号必须与 package.json 一一对应，绝不生成日期后缀变体
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} 已存在，本次推送不发新版本，仅更新 latest 镜像"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "Resolved Tag: $TAG_NAME"
          fi

      - name: Create Git Tag and Release
        if: steps.create_tag.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.create_tag.outputs.tag }}" -m "Release ${{ steps.create_tag.outputs.tag }}"
          git push origin "${{ steps.create_tag.outputs.tag }}"
          gh release create "${{ steps.create_tag.outputs.tag }}" --generate-notes --title "${{ steps.create_tag.outputs.tag }}" || true

  # amd64 / arm64 各自在原生 runner 上构建避免 QEMU 模拟拖慢；api 与 web 镜像互不依赖，拆成 4 个 job 全并行
  build:
    needs: [verify-go, verify-web]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            platform: linux/amd64
            runner: ubuntu-latest
            platform_id: amd64
          - image: api
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_id: arm64
          - image: web
            platform: linux/amd64
            runner: ubuntu-latest
            platform_id: amd64
          - image: web
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_id: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "${DOCKERHUB_USERNAME}" || { echo "::error::Missing secret DOCKERHUB_USERNAME"; exit 1; }
          test -n "${DOCKERHUB_TOKEN}" || { echo "::error::Missing secret DOCKERHUB_TOKEN"; exit 1; }

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        if: matrix.image == 'api'
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }} image by digest
        id: build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          # 仅 api 镜像需要 VERSION build-arg；web 留空（空行会被 build-push-action 过滤）
          build-args: |
            ${{ matrix.image == 'api' && format('VERSION={0}', steps.version.outputs.value) || '' }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.platform_id }}-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform_id }}-${{ matrix.image }}

      - name: Export ${{ matrix.image }} digest
        run: |
          mkdir -p "${{ runner.temp }}/digests-${{ matrix.image }}"
          digest="${{ steps.build_image.outputs.digest }}"
          touch "${{ runner.temp }}/digests-${{ matrix.image }}/${digest#sha256:}"

      - name: Upload ${{ matrix.image }} digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_id }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests-${{ matrix.image }}/*
          if-no-files-found: error
          retention-days: 1

  # 合并各架构 digest 为 multi-arch manifest，并打 latest 等标签
  merge:
    runs-on: ubuntu-latest
    needs:
      - tag-and-release
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download api digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests-api
          pattern: digests-*-api
          merge-multiple: true

      - name: Download web digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests-web
          pattern: digests-*-web
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract api metadata (tags, labels)
        id: meta_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag-and-release.outputs.tag }},enable=${{ needs.tag-and-release.outputs.tag != '' }}
            type=ref,event=tag

      - name: Create api manifest list and push
        working-directory: ${{ runner.temp }}/digests-api
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-api"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect api image
        run: |
          docker buildx imagetools inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-api:${{ steps.meta_api.outputs.version }}"

      - name: Extract web metadata (tags, labels)
        id: meta_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag-and-release.outputs.tag }},enable=${{ needs.tag-and-release.outputs.tag != '' }}
            type=ref,event=tag

      - name: Create web manifest list and push
        working-directory: ${{ runner.temp }}/digests-web
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-web"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect web image
        run: |
          docker buildx imagetools inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}-web:${{ steps.meta_web.outputs.version }}"

name: build-and-push

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - apps/**
      - packages/**
      - docker/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - tsconfig*.json
      - .dockerignore
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME || 'homepage' }}

jobs:
  # 当推送到 main 分支时，自动计算并打上基于当前日期的版本 tag（如 v0.1.1-20261108.1 或 v0.1.1）以及 GitHub Release
  tag-and-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag name
        id: create_tag
        run: |
          VERSION=$(jq -r .version package.json)
          TAG_NAME="v${VERSION}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            DATE_STR=$(date +'%Y%m%d')
            SEQ=1
            while git rev-parse "v${VERSION}-${DATE_STR}.${SEQ}" >/dev/null 2>&1; do
              SEQ=$((SEQ + 1))
            done
            TAG_NAME="v${VERSION}-${DATE_STR}.${SEQ}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved Tag: $TAG_NAME"

      - name: Create Git Tag and Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.create_tag.outputs.tag }}" -m "Release ${{ steps.create_tag.outputs.tag }}"
          git push origin "${{ steps.create_tag.outputs.tag }}"
          gh release create "${{ steps.create_tag.outputs.tag }}" --generate-notes --title "${{ steps.create_tag.outputs.tag }}" || true

  # amd64 / arm64 各自在原生 runner 上构建，避免 QEMU 模拟拖慢
  build:
    runs-on: ${{ matrix.runner }}
    needs: [tag-and-release]
    if: always() && !cancelled() && (needs.tag-and-release.result == 'success' || needs.tag-and-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_id: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_id: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "${DOCKERHUB_USERNAME}" || { echo "::error::Missing secret DOCKERHUB_USERNAME"; exit 1; }
          test -n "${DOCKERHUB_TOKEN}" || { echo "::error::Missing secret DOCKERHUB_TOKEN"; exit 1; }

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.platform_id }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform_id }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 合并各架构 digest 为 multi-arch manifest，并打 latest 等标签
  merge:
    runs-on: ubuntu-latest
    needs:
      - tag-and-release
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.tag-and-release.outputs.tag }},enable=${{ needs.tag-and-release.outputs.tag != '' }}
            type=ref,event=tag

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Home · 管理</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="desk.html">Home</a>
    <span class="spacer"></span>
    <a class="quiet" href="desk.html">返回看板</a>
  </header>
  <div class="admin-wrap">
    <div class="admin-card">
      <aside class="side">
        <h2>Docker</h2>
        <button type="button" class="on">qBittorrent</button>
        <button type="button">Emby</button>
        <button type="button">PgSQL</button>
        <h2>Server</h2>
        <button type="button">PVE</button>
        <button type="button">AdGuard</button>
      </aside>
      <form class="form" action="#" method="post">
        <h1>qBittorrent</h1>
        <label><span>名称</span><input type="text" value="qBittorrent"></label>
        <label><span>链接</span><input type="text" value="http://192.168.50.10:8080"></label>
        <label><span>探测</span><input type="text" value="http://192.168.50.10:8080"></label>
        <label class="check"><input type="checkbox"> 私网探测跳过证书</label>
        <p class="hint">不用于带密钥的请求</p>
        <label>
          <span>面板</span>
          <select>
            <option>qBittorrent</option>
            <option>Emby</option>
            <option>Transmission</option>
            <option>Immich</option>
            <option>Caddy</option>
            <option>Custom API</option>
            <option>无</option>
          </select>
        </label>
        <label><span>口令</span><input type="text" value="" placeholder="已设置，留空则不改" autocomplete="off"></label>
        <span style="display:block;margin-bottom:8px;color:var(--ink-dim);font-size:13px">从图标里选一张</span>
        <div class="candidates">
          <button type="button" class="on"><img alt="" src="../../config/images/192.168.50.10-mrtb50f2-f27fde43.svg"></button>
          <button type="button"><img alt="" src="../../config/images/192.168.50.10-mrtb598b-5a7af2ac.ico"></button>
          <button type="button"><img alt="" src="../../config/images/docker-mrtckjfm-70d1e4f6.png"></button>
        </div>
        <div class="actions">
          <button class="primary" type="submit">保存</button>
          <button class="secondary" type="button">从站点获取</button>
        </div>
      </form>
    </div>
  </div>
  <script src="demo.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · 手机</title>
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div class="phone-body">
    <header class="band" aria-label="时间">
      <img alt="" src="../../config/images/background-mrtblm7i-d2e802de.jpg">
      <div class="caption">
        <p class="date">11月12日 · 农历十月初四 · <span class="term">立冬</span></p>
        <p class="hm"><span data-clock>11:51</span> <span class="sec" data-sec>00</span></p>
      </div>
    </header>
    <main class="phone-main">
      <p class="kicker">正在播放</p>
      <div class="play"><h2>漫长的季节</h2></div>
      <p class="meta">第 8 集 · Emby</p>
      <div class="figures">
        <div><span>下载</span><b>18.6</b></div>
        <div><span>上传</span><b>2.4</b></div>
      </div>
      <p class="meta">qBittorrent · MB/s</p>
      <div class="rule"></div>
      <div data-list>
        <a class="row" data-group="docker" href="#qbit"><img class="ico" alt="" src="../../config/images/192.168.50.10-mrtb50f2-f27fde43.svg"><strong>qBittorrent</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#emby"><img class="ico" alt="" src="../../config/images/192.168.50.10-mrtb598b-5a7af2ac.ico"><strong>Emby</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#abs"><img class="ico" alt="" src="../../config/images/192.168.50.10-mrtb5gu0-eb934513.svg"><strong>Audiobookshelf</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#gitea"><img class="ico" alt="" src="../../config/images/192.168.50.10-mrtb9a3x-5747557c.svg"><strong>Gitea</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#immich"><img class="ico" alt="" src="../../config/images/192.168.50.10-mrtb93hl-5d190be8.ico"><strong>Immich</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#pg"><img class="ico" alt="" src="../../config/images/postgresql_a-mrtcmq7f-c9e8150d.png"><strong>PgSQL</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#openlist"><img class="ico" alt="" src="../../config/images/192.168.50.10-mrtb5udu-23273833.svg"><strong>Openlist</strong><i class="lamp"></i></a>
        <a class="row" data-group="docker" href="#pve" hidden><img class="ico" alt="" src="../../config/images/192.168.50.100-mrtb3te0-bea52438.png"><strong>PVE</strong><i class="lamp"></i></a>
        <a class="row" data-group="server" href="#ikuai" hidden><img class="ico" alt="" src="../../config/images/192.168.50.254-mrtb3lmd-88a7ccd6.ico"><strong>iKuai</strong><i class="lamp"></i></a>
        <a class="row" data-group="server" href="#owrt" hidden><img class="ico" alt="" src="../../config/images/192.168.50.1-mrtb3p4r-30e7bc75.svg"><strong>OpenWrt</strong><i class="lamp"></i></a>
        <a class="row" data-group="server" href="#adg" hidden><img class="ico" alt="" src="../../config/images/192.168.50.1-mrtb4je7-d49d9ac4.png"><strong>AdGuard</strong><i class="lamp down"></i></a>
        <a class="row" data-group="pt" href="#hdsky" hidden><img class="ico" alt="" src="../../config/images/hdsky.me-mrt7ggdf-879f3dab.ico"><strong>HDSky</strong><i class="lamp none"></i></a>
        <a class="row" data-group="pt" href="#aud" hidden><img class="ico" alt="" src="../../config/images/audiences.me-mrt7h2px-42c3bdeb.ico"><strong>观众</strong><i class="lamp none"></i></a>
      </div>
    </main>
    <nav class="dock" aria-label="分组">
      <button type="button" data-tab="server">机器</button>
      <button type="button" data-tab="docker" class="on">服务</button>
      <button type="button" data-tab="pt">站点</button>
    </nav>
    <a class="switch" href="desk.html">电脑版</a>
  </div>
  <script src="demo.js"></script>
</body>
</html>
